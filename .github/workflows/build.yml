name: Build

on:
  push:
    branches:
      - main
      - dev


jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm install

      # Build Docker image
      - name: Build Docker Image
        run: docker build --no-cache -t jansenbhodi/fontys-projects:latest .

      #publish it on Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        run: docker push jansenbhodi/fontys-projects:latest

      # Trigger Railway redeploy
      - name: Redeploy on Railway
        run: |
          curl -X POST https://backboard.railway.app/graphql/v2 \
            -H "Authorization: Bearer ${{ secrets.RAILWAY }}" \
            -H "Content-Type: application/json" \
            -d '{"query": "mutation { serviceInstanceRedeploy(environmentId: \"${{ secrets.RAILWAY_FRONTEND_ENV_ID }}\", serviceId: \"${{ secrets.RAILWAY_FRONTEND_SERVICE_ID }}\") }"}'
      

      # I would run Sonar CLoud here but that does automatic checks on pulls.
